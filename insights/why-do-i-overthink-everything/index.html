        <h1>为什么我总在想太多？</h1>
        <p class="lead">很多时候这不是矫情，而是你的系统在做高频风险模拟。</p>
      </section>
      <section class="section card">
        <p>如果你会反复回放对话、预演结果、迟迟不行动，你的系统可能把“避免出错”放在了“快速推进”之前。</p>
        <p>这通常对应 <a href="/types/exs/">内耗大师（EXS）</a>，有时也会和 <a href="/types/sea/">情绪雷达（SEA）</a>重叠。</p>
      </section>
      <section class="section card">
        <h2>可以先试这三步</h2>
        <p>1. 给思考设置截止时间。</p>
        <p>2. 在“完全想清楚”前先做一个最小动作。</p>
        <p>3. 用真实反馈替代反复脑补。</p>
      </section>

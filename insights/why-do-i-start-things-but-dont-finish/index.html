        <h1>为什么我总是开头猛，后面断？</h1>
        <p class="lead">启动能力和持续能力是两套系统，不是一个开关。</p>
      </section>
      <section class="section card">
        <p>很多人不是不努力，而是更擅长起盘，不擅长长线维持。新鲜感高时很猛，进入重复后容易掉速。</p>
        <p>常见关联类型：<a href="/types/xos/">脑洞玩家（XOS）</a>、<a href="/types/mxt/">多版本玩家（MXT）</a>、<a href="/types/exs/">内耗大师（EXS）</a>。</p>
      </section>
      <section class="section card">
        <h2>可以先试这三步</h2>
        <p>1. 同时只保留一个主项目。</p>
        <p>2. 新点子统一放进点子池，不立刻换主线。</p>
        <p>3. 把“完成”拆成更小可见阶段。</p>

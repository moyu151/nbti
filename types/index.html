<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBTI 人格类型库</title>
    <meta name="description" content="18种 NBTI 人格类型总览：人格说明、行为分析、优势问题、FAQ、相关推荐。" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <script src="/assets/js/data.js" defer></script>
    <script src="/assets/js/app.js" defer></script>
  </head>
  <body>
    <main class="site-wrap">
      <header class="topbar">
        <a class="logo" href="/">NBTI <small>Not MBTI</small></a>
        <nav class="nav">
          <a href="/test/">测试</a>
          <a href="/rankings/">排行榜</a>
          <a href="/insights/why-do-i-overthink-everything/">洞察</a>
          <a href="/faq/">FAQ</a>
          <a href="/about/">关于</a>
        </nav>
      </header>
      <section class="hero">
        <h1>你更像哪种人</h1>
        <p class="lead">（也可能不止一种）</p>
        <p class="muted">点击任意类型查看详情</p>
      </section>
      <section class="section">
        <div id="types-filter-bar" class="filter-row">
          <button class="chip active" data-filter="all">🔥 最容易对号入座</button>
          <button class="chip" data-filter="think">🧠 想很多型</button>
          <button class="chip" data-filter="multi">🎭 多版本型</button>
          <button class="chip" data-filter="social">📢 社交关系型</button>
          <button class="chip" data-filter="steady">🧱 稳定执行型</button>
        </div>
      </section>
      <section class="section">
        <div id="types-list-app" class="feed-grid"></div>
      </section>
      <section class="section">
        <h2>猜你也会搜</h2>
        <div class="grid">
          <a class="card" href="/insights/why-do-i-overthink-everything/" data-track="types_insights_click" data-track-meta="overthink">
            <p><strong>Why do I overthink everything?</strong></p>
            <p class="muted">对应类型：EXS / SEA</p>
          </a>
          <a class="card" href="/insights/why-do-i-start-things-but-dont-finish/" data-track="types_insights_click" data-track-meta="start_finish">
            <p><strong>Why do I start things but never finish?</strong></p>
            <p class="muted">对应类型：XOS / MXT</p>
          </a>
          <a class="card" href="/insights/why-do-i-feel-like-different-versions-of-myself/" data-track="types_insights_click" data-track-meta="multi_version">
            <p><strong>Why do I feel like different versions of myself?</strong></p>
            <p class="muted">对应类型：MXT / SACE</p>
          </a>
        </div>
      </section>
      <a class="btn floating-cta" href="/test/" data-track="types_cta_click" data-track-meta="floating">👉 测测我是哪种人</a>
      <footer class="footer">
        <p>你觉得你更像哪一个？</p>
      </footer>
    </main>
  </body>
</html>

  <body>
    <main class="site-wrap">
      <header class="topbar">
        <a class="logo" href="/">NBTI <small>Next-generation Behavioral<br />Traits Inventory</small></a>
        <nav class="nav">
          <a href="/test/">开始测试</a>
          <a href="/types/">所有类型</a>
          <a href="/rankings/">排行榜</a>
          <a href="/insights/">自我洞察</a>
          <a href="/faq/">FAQ</a>
          <a href="/about/">关于</a>
        </nav>
      </header>
      <section class="hero">
        <h1>你更像哪种人</h1>
        <p class="lead">（也可能不止一种）</p>
        <p class="muted">点击任意类型查看详情</p>
      </section>
      <section class="section">
        <div id="types-filter-bar" class="filter-row">
          <button class="chip active" data-filter="all">🔥 最容易对号入座</button>

          <button class="chip" data-filter="steady">🧱 稳定执行型</button>
        </div>
      </section>
      <section class="section">
        <div id="types-list-app" class="feed-grid"></div>
      </section>
      <section class="section">
        <h2>猜你也会搜</h2>
        <div class="grid">
          <a class="card" href="/insights/why-do-i-overthink-everything/" data-track="types_insights_click" data-track-meta="overthink">
            <p><strong>为什么我总在想太多？</strong></p>
            <p class="muted">对应类型：EXS / SEA</p>
          </a>
          <a class="card" href="/insights/why-do-i-start-things-but-dont-finish/" data-track="types_insights_click" data-track-meta="start_finish">

            <p class="muted">对应类型：XOS / MXT</p>
          </a>

            <p class="muted">对应类型：MXT / SACE</p>
          </a>
        </div>

      <a class="btn floating-cta" href="/test/" data-track="types_cta_click" data-track-meta="floating">👉 测测我是哪种人</a>
